# All service schemas + seed data on first Postgres start (empty volume only).
# Re-init: docker compose -f postgres.yml down -v && docker compose -f postgres.yml up -d
#
# Run microservices with: export SPRING_PROFILES_ACTIVE=docker

services:
  postgres:
    image: postgres:16-alpine
    hostname: postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: postgres
    volumes:
      - "./volumes/postgres/data:/var/lib/postgresql/data"
      - "./postgres/init:/docker-entrypoint-initdb.d:ro"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - food-ordering-system

networks:
  food-ordering-system:
    driver: bridge
